<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,600;1,500&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script>
    (function () {
      var stored = localStorage.getItem('vox-theme');
      var theme =
        stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-vox-theme', theme);
    })();
  </script>
  <style>
    html { background-color: #f5faf9; }
    html[data-vox-theme='dark'] { background-color: #0d1417; }
    html:not([data-vox-ready]) body { visibility: hidden; }
  </style>
  <noscript><style>body { visibility: visible !important; }</style></noscript>
  <script>
    setTimeout(function () {
      document.documentElement.setAttribute('data-vox-ready', '');
    }, 2000);
  </script>
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  {% assign entry = site.data.manifest["docs/src/main.js"] %}
  {% for href in entry.css %}
  <link rel="stylesheet" href="{{ '/assets/' | append: href | relative_url }}" />
  {% endfor %}
  <script type="module" src="{{ '/assets/' | append: entry.file | relative_url }}"></script>
</head>
