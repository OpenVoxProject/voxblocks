# Left sidebar, keyed by section. This is the single source of truth for
# "which section does this page belong to" — _plugins/sidebar_pager.rb
# walks every entry here once and stamps the owning section's key onto
# each matching page as page.section, which both this sidebar
# (_layouts/default.html) and the header nav (_includes/nav.html, via
# nav.yml's own `section:` field) key off of. Sections are NOT simply the
# URL's first path segment — e.g. utilities/colors both live under
# /guide/ on disk but belong to the "utilities" section, not "guide",
# because that's how they're grouped here. Links are baseurl-free with a
# trailing slash — see nav.yml for the rule this file follows. A page not
# listed under any section here (e.g. /icons/) simply renders without a
# sidebar — see _layouts/default.html.

guide:
  - text: Guide
    items:
      - { text: Getting Started, link: /guide/getting-started/ }
      - { text: Design Tokens, link: /guide/design-tokens/ }

utilities:
